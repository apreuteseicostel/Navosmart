name: Sonar display regression and performance
on:
  push:
    branches: [main, 'fix/**', feature/kogger-native-dataset-adapter-20261002]
    paths: ['custom/qml/NavoSonarPro.qml', 'custom/qml/NavoBathymetryHDOverlay.qml', 'tests/sonar-performance/**', '.github/workflows/navo-sonar-display.yml']
  pull_request:
    paths: ['custom/qml/NavoSonarPro.qml', 'custom/qml/NavoBathymetryHDOverlay.qml', 'tests/sonar-performance/**', '.github/workflows/navo-sonar-display.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  display:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime and build tools
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-svg-dev qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates
      - name: Build real Canvas benchmark
        run: cmake -S tests/sonar-performance -B /tmp/navo-sonar-display && cmake --build /tmp/navo-sonar-display -j2
      - name: Verify peak preservation and measure full-history paint
        run: set -o pipefail; /tmp/navo-sonar-display/navo-sonar-performance "$PWD/custom/qml/NavoSonarPro.qml" "$PWD/tests/sonar-performance/mock-imports" | tee sonar-performance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-display-evidence
          path: |
            sonar-performance.txt
            sonar-performance.png
