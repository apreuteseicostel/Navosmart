name: Kogger recorded CHART replay
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'custom/src/NavoKogger*'
      - 'custom/src/NavoAndroidAcceptance.h'
      - 'custom/qml/NavoAndroidAcceptance.qml'
      - 'custom/qml/NavoSonar*.qml'
      - 'custom/qml/NavoDashboard.qml'
      - 'custom/qml/NavoMap.qml'
      - 'custom/qml/NavoNativeBathymetryOverlay.qml'
      - 'custom/qml/NavoScanCoordinator.qml'
      - 'custom/src/NavoPersistence*'
      - 'custom/qml/NavoHopperBridge.qml'
      - 'custom/qml/NavoBaitingPanel.qml'
      - '.github/workflows/android.yml'
      - 'custom/CMakeLists.txt'
      - 'custom/kogger_native/**'
      - 'third_party/KoggerApp/**'
      - 'tests/kogger-replay/**'
      - 'tests/sonar-performance/**'
      - '.github/workflows/kogger-replay.yml'
  workflow_dispatch:
concurrency:
  group: kogger-replay-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt Core build tools
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-svg-dev qml6-module-qtpositioning qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - name: Build actual NAVO decoder
        run: cmake -S tests/kogger-replay -B /tmp/navo-replay && cmake --build /tmp/navo-replay -j2
      - name: Build Sonar display benchmark
        run: cmake -S tests/sonar-performance -B /tmp/navo-sonar-performance && cmake --build /tmp/navo-sonar-performance -j2
      - name: Package runnable Qt test environments
        run: python3 tests/kogger-replay/bundle-runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: navo-qt-core-runner
          path: /tmp/navo-qt-runtime/core.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: navo-qt-ui-runner
          path: /tmp/navo-qt-runtime/ui.tar.gz
      - name: Test native surface geometry
        run: /tmp/navo-replay/navo-native-surface
      - name: Test production H743 servo feedback wiring
        run: /tmp/navo-replay/navo-servo-feedback custom/qml/NavoHopperBridge.qml
      - name: Test installed acceptance scene ownership
        run: /tmp/navo-replay/navo-acceptance-scene
      - name: Test bounded elapsed replay pacing
        run: /tmp/navo-replay/navo-replay-pacing
      - name: Test protocol regressions
        run: /tmp/navo-replay/navo-kogger-replay
      - uses: actions/cache@v4
        id: fixture-cache
        with:
          path: /tmp/00028_DownView.klf
          key: kogger-downview-1ff5e23abbdd37e31eeacd7875c4e8a457ccb927641e47ea77c861151ab2ace0
      - name: Fetch original Kogger recording
        if: steps.fixture-cache.outputs.cache-hit != 'true' 
        run: curl --fail --location --retry 3 --max-time 180 https://kogger.tech/wp-content/uploads/00028_DownView.klf -o /tmp/00028_DownView.klf
      - name: Replay verified fixture through actual NAVO decoder
        run: /tmp/navo-replay/navo-kogger-replay /tmp/00028_DownView.klf custom/qml/NavoSonarEthernet.qml

      - name: Render production native surface Canvas
        run: /tmp/navo-replay/navo-native-surface-view tests/kogger-replay/native-surface-view.qml kogger-native-surface.json
      - name: Render actual Sonar PRO component from recorded columns
        run: /tmp/navo-replay/navo-sonar-ui-replay custom/qml/NavoSonarPro.qml tests/kogger-replay/mock-imports kogger-columns.json
      - name: Benchmark and verify full-resolution display cache
        run: /tmp/navo-sonar-performance/navo-sonar-performance "$PWD/custom/qml/NavoSonarPro.qml" "$PWD/tests/kogger-replay/mock-imports" "$PWD/kogger-columns.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kogger-recorded-evidence
          path: |
            kogger-native-surface*.png
            kogger-native-surface.json
            kogger-sonar-pro-*.png
            sonar-performance.png
            kogger-bottom-track.csv
            kogger-bathymetry-cells.csv
          if-no-files-found: ignore
