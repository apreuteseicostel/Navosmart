name: NAVO firmware and persistence
on:
  push:
    branches: [main, 'fix/**', 'feature/kogger-native-dataset-adapter-20261002']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: navo-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware-persistence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc arduino-core-avr qt6-base-dev cmake g++ lua5.3
      - name: Compile actual classic Nano firmware and test command parser
        run: bash tests/firmware/build-nano.sh
      - name: Test H743 Lua UART bridge under fragmented and malformed input
        run: lua5.3 tests/firmware/nano-bridge.lua
      - name: Build and test persistence under write failures
        run: cmake -S tests/persistence -B /tmp/navo-persistence && cmake --build /tmp/navo-persistence -j2 && /tmp/navo-persistence/navo-persistence-test
      - name: G20 physical RC input regressions
        run: node tests/g20-input.mjs
      - name: Controller regressions
        run: |
          node tests/audit-regressions.mjs
          node tests/route-plan.mjs
          node tests/steering-bottom.mjs
      - name: Render production Missions UI with Qt 6.8.3
        run: |
          python3 -m venv /tmp/navo-ui-env
          /tmp/navo-ui-env/bin/pip install PySide6-Essentials==6.8.3 PySide6-Addons==6.8.3
          /tmp/navo-ui-env/bin/python tests/qml-module-import.py
          /tmp/navo-ui-env/bin/python tests/missions-ui.py
          /tmp/navo-ui-env/bin/python tests/steering-ui.py
          /tmp/navo-ui-env/bin/python tests/sonar-recording-ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: NAVO-NANO-FIRMWARE
          path: |
            build/firmware-nano/NAVO_NANO.hex
            build/firmware-nano/NAVO_NANO.elf
