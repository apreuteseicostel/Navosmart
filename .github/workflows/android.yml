name: Build NAVO SMART Android
on:
  push:
    branches: [main]
  workflow_dispatch:
# build revision 3
jobs:
  android:
    runs-on: ubuntu-22.04
    env:
      QT_VERSION: 6.8.3
      QT_ANDROID_ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned QGroundControl
        run: |
          git clone --depth 1 --branch v5.0.7 --recurse-submodules --shallow-submodules https://github.com/mavlink/qgroundcontrol.git qgc
          rm -rf qgc/custom
          cp -a custom qgc/custom
          # QGC v5.0.7 tracks PX4-GPSDrivers main, which is no longer API-compatible.
          sed -i 's/GIT_TAG main/GIT_TAG caf5158061bd10e79c9f042abb62c86bc6f3e7a7/' qgc/src/GPS/CMakeLists.txt
          grep -A4 -B2 "PX4-GPSDrivers" qgc/src/GPS/CMakeLists.txt
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Android NDK r26b
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
          add-to-path: false
      - name: Export NDK
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: '${{ runner.temp }}'
          modules: 'qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors'
          setup-python: false
          cache: true
      - name: Install Qt Android arm64
        run: |
          python3 -m pip install --user 'aqtinstall==3.1.*'
          python3 -m aqt install-qt linux android 6.8.3 android_arm64_v8a --outputdir "${{ runner.temp }}/Qt" --modules qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
      - name: Configure
        run: |
          mkdir -p build
          "${{ runner.temp }}/Qt/6.8.3/android_arm64_v8a/bin/qt-cmake" -S qgc -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DQT_HOST_PATH="${{ runner.temp }}/Qt/6.8.3/gcc_64" \
            -DQT_ANDROID_SIGN_APK=OFF \
            -DQGC_STABLE_BUILD=ON
      - name: Build APK
        run: cmake --build build --target all --config Release --parallel
      - name: Prepare installable APK
        run: |
          set -euo pipefail
          APK="$(find build -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "Built APK: $APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          if ! "$APKSIGNER" verify "$APK"; then
            echo "APK is not signed; applying CI debug signature for direct sideload testing."
            KS="$HOME/.android/debug.keystore"
            mkdir -p "$HOME/.android"
            if [ ! -f "$KS" ]; then
              keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=NAVO SMART,C=GB"
            fi
            "$ZIPALIGN" -f -p 4 "$APK" build/NAVO_SMART-aligned.apk
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out build/NAVO_SMART.apk build/NAVO_SMART-aligned.apk
          else
            cp "$APK" build/NAVO_SMART.apk
          fi
          "$APKSIGNER" verify --verbose --print-certs build/NAVO_SMART.apk
          "$AAPT" dump badging build/NAVO_SMART.apk | head -n 8
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NAVO-SMART-INSTALLABLE-APK
          path: build/NAVO_SMART.apk
