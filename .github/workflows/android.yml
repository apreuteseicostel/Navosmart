name: Build NAVO SMART Android
on:
  push:
    branches: [main, feature/area-scan-bathymetry-resume, feature/unified-navosmart-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
# build revision 3
jobs:
  android:
    runs-on: ubuntu-22.04
    env:
      QT_VERSION: 6.8.3
      QT_ANDROID_ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned QGroundControl
        run: |
          git clone --depth 1 --branch v5.0.7 --recurse-submodules --shallow-submodules https://github.com/mavlink/qgroundcontrol.git qgc
          rm -rf qgc/custom
          cp -a custom qgc/custom
          # QGC v5.0.7 exposes FlyViewMap from QGroundControl.FlightDisplay;
          # PlanView is not a QML module in this release (its module CMake is disabled).
          sed -i 's/QGroundControl\.FlyView/QGroundControl.FlightDisplay/g' qgc/custom/CMakeLists.txt qgc/custom/qml/NavoDashboard.qml
          sed -i '/QGroundControl\.PlanView/d' qgc/custom/CMakeLists.txt qgc/custom/qml/NavoDashboard.qml
          sed -i 's/GIT_TAG main/GIT_TAG caf5158061bd10e79c9f042abb62c86bc6f3e7a7/' qgc/src/GPS/CMakeLists.txt
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Android NDK r26b
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
          add-to-path: false
      - name: Export NDK
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: '${{ runner.temp }}'
          modules: 'qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors'
          setup-python: false
          cache: true
      - name: Install Qt Android ABIs
        run: |
          python3 -m pip install --user 'aqtinstall==3.1.*'
          MODS='qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors'
          python3 -m aqt install-qt linux android 6.8.3 android_arm64_v8a --outputdir "${{ runner.temp }}/Qt" --modules $MODS
          python3 -m aqt install-qt linux android 6.8.3 android_x86_64 --outputdir "${{ runner.temp }}/Qt" --modules $MODS
      - name: Configure arm64 release
        run: |
          mkdir -p build
          "${{ runner.temp }}/Qt/6.8.3/android_arm64_v8a/bin/qt-cmake" -S qgc -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DQT_ANDROID_ABIS=arm64-v8a -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DQT_HOST_PATH="${{ runner.temp }}/Qt/6.8.3/gcc_64" -DQT_ANDROID_SIGN_APK=OFF -DQGC_STABLE_BUILD=ON
      - name: Build arm64 APK
        run: cmake --build build --target all --config Release --parallel
      - name: Prepare installable APK
        run: |
          set -euo pipefail
          APK="$(find build -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"; ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"; AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          if ! "$APKSIGNER" verify "$APK"; then
            KS="$HOME/.android/debug.keystore"; mkdir -p "$HOME/.android"
            [ -f "$KS" ] || keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=NAVO SMART,C=GB"
            "$ZIPALIGN" -f -p 4 "$APK" build/NAVO_SMART-aligned.apk
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out build/NAVO_SMART.apk build/NAVO_SMART-aligned.apk
          else cp "$APK" build/NAVO_SMART.apk; fi
          "$APKSIGNER" verify --verbose --print-certs build/NAVO_SMART.apk
          "$AAPT" dump badging build/NAVO_SMART.apk | head -n 8
      - name: Configure x86_64 smoke-test APK
        run: |
          mkdir -p build-x86
          "${{ runner.temp }}/Qt/6.8.3/android_x86_64/bin/qt-cmake" -S qgc -B build-x86 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DQT_ANDROID_ABIS=x86_64 -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DQT_HOST_PATH="${{ runner.temp }}/Qt/6.8.3/gcc_64" -DQT_ANDROID_SIGN_APK=OFF -DQGC_STABLE_BUILD=ON
      - name: Build x86_64 smoke-test APK
        run: cmake --build build-x86 --target all --config Release --parallel
      - name: Prepare x86_64 smoke-test APK
        run: |
          set -euo pipefail
          APK="$(find build-x86/android-build/build/outputs/apk -type f -name '*-unsigned.apk' | head -n 1)"; test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"; ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"; KS="$HOME/.android/debug.keystore"
          test -f "$KS"
          "$ZIPALIGN" -f -p 4 "$APK" build-x86/NAVO_SMART-x86-aligned.apk
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out build-x86/NAVO_SMART-x86.apk build-x86/NAVO_SMART-x86-aligned.apk
          "$APKSIGNER" verify --verbose build-x86/NAVO_SMART-x86.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build-x86/NAVO_SMART-x86.apk >/dev/null
      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            # Retry transient hosted-runner ADB/emulator startup failures.
            for attempt in 1 2 3; do
              adb start-server || true
              if adb wait-for-device && adb shell getprop sys.boot_completed | grep -q 1 && adb install -r build-x86/NAVO_SMART-x86.apk; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "ADB/emulator infrastructure unavailable after 3 attempts" >&2
                exit 1
              fi
              echo "ADB/emulator attempt $attempt failed; restarting adb before retry"
              adb kill-server || true
              sleep 10
            done
            test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build-x86/NAVO_SMART-x86.apk | grep -m1 '^package:'
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build-x86/NAVO_SMART-x86.apk | grep -m1 '^launchable-activity:'
            adb logcat -c
            mkdir -p build/screenshots
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 1 || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am start -W -n "$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build-x86/NAVO_SMART-x86.apk | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n1)/$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build-x86/NAVO_SMART-x86.apk | sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p" | head -n1)"
            sleep 5
            adb exec-out screencap -p > build/screenshots/dashboard-05s.png || true
            sleep 10
            adb exec-out screencap -p > build/screenshots/dashboard-15s.png || true
            sleep 15
            adb exec-out screencap -p > build/screenshots/dashboard-30s.png || true
            cp build/screenshots/dashboard-30s.png build/navo-screenshot.png 2>/dev/null || true
            adb shell dumpsys window windows > build/window.txt || true
            adb shell dumpsys activity activities > build/activity.txt || true
            adb logcat -d > build/navo-logcat.txt || true
            adb shell pidof "$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build-x86/NAVO_SMART-x86.apk | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n1)" | tee build/navo-pid.txt
            test -s build/navo-pid.txt
      - name: Upload Android smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NAVO-SMART-ANDROID-SMOKE-TEST
          path: |
            build/navo-pid.txt
            build/window.txt
            build/activity.txt
            build/navo-logcat.txt
            build/navo-screenshot.png
            build/screenshots/*.png
          if-no-files-found: warn
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NAVO-SMART-INSTALLABLE-APK
          path: build/NAVO_SMART.apk
