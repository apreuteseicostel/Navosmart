name: Build NAVO SMART Android
# ARM64 APK CI; extended emulator and sonar decoding tests paused by request.
# Manual dispatch remains available for full release validation.
on:
  push:
    branches: [main]
    paths:
      - 'custom/**'
      - 'tools/prepare-skydroid-android.py'
      - 'tools/prepare-fpv-android.py'
      - 'tests/skydroid/**'
      - 'third_party/**'
      - 'tests/android/**'
      - 'tests/audit-regressions.mjs'
      - 'tests/route-plan.mjs'
      - 'tests/steering-bottom.mjs'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'custom/**'
      - 'tools/prepare-skydroid-android.py'
      - 'tools/prepare-fpv-android.py'
      - 'tests/skydroid/**'
      - 'third_party/**'
      - 'tests/android/**'
      - 'tests/audit-regressions.mjs'
      - 'tests/route-plan.mjs'
      - 'tests/steering-bottom.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Keep only the newest Android validation for the same PR/branch.
# This prevents one small UI commit from consuming another full multi-hour build.
concurrency:
  group: navo-android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# build revision 4
jobs:
  android:
    runs-on: ubuntu-22.04
    env:
      QT_VERSION: 6.8.3
      QT_ANDROID_ABIS: arm64-v8a
      CCACHE_DIR: ${{ github.workspace }}/build-cache/ccache
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
      - name: NAVO controller regression tests
        run: |
          node tests/audit-regressions.mjs
          node tests/route-plan.mjs
          node tests/steering-bottom.mjs
          python3 tests/android/navigation-locator.py
          python3 -m unittest discover -s tests -p 'test_prepare_skydroid_android.py'
      - name: Clone pinned QGroundControl
        run: |
          git clone --depth 1 --branch v5.0.7 --recurse-submodules --shallow-submodules https://github.com/mavlink/qgroundcontrol.git qgc
          rm -rf qgc/custom
          cp -a custom qgc/custom
          cp -a third_party qgc/third_party
          python3 tools/prepare-skydroid-android.py qgc
          python3 tools/prepare-fpv-android.py qgc
          sed -i '/import NavoSmart.Backend 1.0/i import NavoSmart 1.0' qgc/custom/qml/NavoDashboard.qml
          sed -i 's/QGroundControl\.FlyView/QGroundControl.FlightDisplay/g' qgc/custom/CMakeLists.txt qgc/custom/qml/NavoDashboard.qml
          sed -i '/QGroundControl\.PlanView/d' qgc/custom/CMakeLists.txt qgc/custom/qml/NavoDashboard.qml
          # NAVO draws its own boat marker; suppress only QGC's default VehicleMapItem.
          python3 -c 'from pathlib import Path; p=Path("qgc/src/FlightDisplay/FlyViewMap.qml"); s=p.read_text(); a=s.index("    // Add the vehicles to the map\n"); b=s.index("    // Add distance sensor view\n",a); block=s[a:b]; assert "QGroundControl.multiVehicleManager.vehicles" in block and "VehicleMapItem" in block, "NAVO: unexpected QGC vehicle marker block"; p.write_text(s[:a]+"    // NAVO: default QGC vehicle marker intentionally suppressed.\n"+s[b:])'
          sed -i 's/GIT_TAG main/GIT_TAG caf5158061bd10e79c9f042abb62c86bc6f3e7a7/' qgc/src/GPS/CMakeLists.txt
          # Pin libevents to the revision used by the last green build. Upstream main
          # gained 32-bit system-ID helpers on 2026-09-27 that QGC v5.0.7 MAVLink lacks.
          sed -i 's/GIT_TAG main/GIT_TAG 077677a7d2f48f0af0eb8a4e4a7b6310956728bc/' qgc/src/MAVLink/LibEvents/CMakeLists.txt
          # NAVO replaces QGC FlyView through the custom URL interceptor.
          # Do not patch upstream Viewer3D here: the old text patch was brittle and
          # run #229 still loaded the upstream FlyView, masking NAVO QML errors.
          grep -n "NavoDashboard.qml" qgc/custom/src/CustomPlugin.cc
          # NAVO Android lifecycle guard. QGC v5.0.7 dereferences
          # _mainRootWindow on QEvent::Quit even when it is still null. Current
          # upstream QGC has this guard; apply the same minimal fix to v5.0.7.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("qgc/src/QGCApplication.cc")
          src = p.read_text()
          needle = '        const bool forceClose = _mainRootWindow->property("_forceClose").toBool();'
          guard = '''        if (!_mainRootWindow) {
              return QApplication::event(e);
          }
          const bool forceClose = _mainRootWindow->property("_forceClose").toBool();'''
          if needle not in src:
              raise SystemExit("QGCApplication forceClose line not found in pinned v5.0.7")
          p.write_text(src.replace(needle, guard, 1))
          PY
          grep -n -A9 -B4 'if (!_mainRootWindow)' qgc/src/QGCApplication.cc
      - name: Install compiler cache
        run: sudo apt-get update && sudo apt-get install -y ccache
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-navo-qgc5.0.7-qt6.8.3-ndk26b-v1-${{ hashFiles('custom/**', '.github/workflows/android.yml') }}
          restore-keys: |
            ${{ runner.os }}-navo-qgc5.0.7-qt6.8.3-ndk26b-v1-
      - name: Initialize compiler cache
        run: ccache --max-size=2GiB && ccache --zero-stats
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Android NDK r26b
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
          add-to-path: false
      - name: Export NDK
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: Setup Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: '${{ runner.temp }}'
          modules: 'qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors'
          setup-python: true
          cache: true
      - name: Validate all NAVO QML syntax and QObject headers
        run: |
          set -euo pipefail
          QT_HOST="${{ runner.temp }}/Qt/6.8.3/gcc_64"
          for file in custom/qml/*.qml; do
            "$QT_HOST/bin/qmlformat" "$file" > /dev/null
          done
          for file in custom/src/*.h; do
            "$QT_HOST/libexec/moc" -I"$QT_HOST/include" -I"$QT_HOST/include/QtCore" "$file" -o /tmp/navo-moc-check.cpp
          done
      - name: Install Qt Android ABIs
        run: |
          python3 -m pip install --user 'aqtinstall==3.1.*'
          MODS='qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors'
          python3 -m aqt install-qt linux android 6.8.3 android_arm64_v8a --outputdir "${{ runner.temp }}/Qt" --modules $MODS
      - name: Configure arm64 release
        run: |
          mkdir -p build
          "${{ runner.temp }}/Qt/6.8.3/android_arm64_v8a/bin/qt-cmake" -S qgc -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DQT_ANDROID_ABIS=arm64-v8a -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DQT_HOST_PATH="${{ runner.temp }}/Qt/6.8.3/gcc_64" -DQT_ANDROID_SIGN_APK=OFF -DQGC_STABLE_BUILD=ON -DQGC_USE_CACHE=ON
      - name: Build arm64 APK
        shell: bash
        run: |
          set -o pipefail
          # Limit compiler concurrency on hosted runners to reduce peak RAM use.
          # Persist a short failure tail in the job summary even if artifacts fail.
          echo "ARM64 build: max 2 parallel compile jobs" | tee build/arm64-build.log
          if cmake --build build --target all --config Release --parallel 2 2>&1 | tee -a build/arm64-build.log; then
            echo "ARM64 build succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=${PIPESTATUS[0]}
            echo "### ARM64 build failed (exit ${rc})" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 90 build/arm64-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
      - name: Prepare installable APK
        run: |
          set -euo pipefail
          APK="$(find build -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"; ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"; AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          if ! "$APKSIGNER" verify "$APK"; then
            KS="$HOME/.android/debug.keystore"; mkdir -p "$HOME/.android"
            [ -f "$KS" ] || keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=NAVO SMART,C=GB"
            "$ZIPALIGN" -f -p 4 "$APK" build/NAVO_SMART-aligned.apk
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out build/NAVO_SMART.apk build/NAVO_SMART-aligned.apk
          else cp "$APK" build/NAVO_SMART.apk; fi
          "$APKSIGNER" verify --verbose --print-certs build/NAVO_SMART.apk
          "$AAPT" dump badging build/NAVO_SMART.apk | head -n 8
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Save compiler cache after functional checks
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload ARM64 build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NAVO-SMART-ARM64-BUILD-LOG
          path: build/arm64-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload installable APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NAVO-SMART-INSTALLABLE-APK
          path: build/NAVO_SMART.apk
