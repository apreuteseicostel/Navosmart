name: Build NAVO SMART Android
on:
  push:
    branches: [main, feature/area-scan-bathymetry-resume, feature/unified-navosmart-integration, feature/bathymetry-3d, audit/full-integration-23-sep]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep only the newest Android validation for the same PR/branch.
# This prevents one small UI commit from consuming another full multi-hour build.
concurrency:
  group: navo-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# build revision 4
jobs:
  android:
    runs-on: ubuntu-22.04
    env:
      QT_VERSION: 6.8.3
      QT_ANDROID_ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - name: NAVO controller regression tests
        run: node tests/audit-regressions.mjs
      - name: Clone pinned QGroundControl
        run: |
          git clone --depth 1 --branch v5.0.7 --recurse-submodules --shallow-submodules https://github.com/mavlink/qgroundcontrol.git qgc
          rm -rf qgc/custom
          cp -a custom qgc/custom
          sed -i '/import NavoSmart.Backend 1.0/i import NavoSmart 1.0' qgc/custom/qml/NavoDashboard.qml
          sed -i 's/QGroundControl\.FlyView/QGroundControl.FlightDisplay/g' qgc/custom/CMakeLists.txt qgc/custom/qml/NavoDashboard.qml
          sed -i '/QGroundControl\.PlanView/d' qgc/custom/CMakeLists.txt qgc/custom/qml/NavoDashboard.qml
          sed -i 's/GIT_TAG main/GIT_TAG caf5158061bd10e79c9f042abb62c86bc6f3e7a7/' qgc/src/GPS/CMakeLists.txt
          # NAVO renders the bait boat itself at the H743/UM982 coordinate.
          # Add a narrow custom switch to pinned FlyViewMap so only QGC's stock
          # vehicle icon can be hidden; ADS-B, proximity and mission overlays remain.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("qgc/src/FlightDisplay/FlyViewMap.qml")
          src = p.read_text()
          prop_anchor = "    property bool   pipMode:                    false   // true: map is shown in a small pip mode\\n"
          prop_line = prop_anchor + "    property bool   navosmartHideVehicleMarker: false\\n"
          if prop_anchor not in src:
              raise SystemExit("FlyViewMap property anchor not found in pinned v5.0.7")
          src = src.replace(prop_anchor, prop_line, 1)
          vehicle_anchor = "    MapItemView {\\n        model: QGroundControl.multiVehicleManager.vehicles\\n        delegate: VehicleMapItem {"
          vehicle_patch = "    MapItemView {\\n        model: QGroundControl.multiVehicleManager.vehicles\\n        visible: !_root.navosmartHideVehicleMarker\\n        delegate: VehicleMapItem {"
          if vehicle_anchor not in src:
              raise SystemExit("FlyViewMap vehicle marker block not found in pinned v5.0.7")
          p.write_text(src.replace(vehicle_anchor, vehicle_patch, 1))
          PY
          grep -n -A4 -B2 'navosmartHideVehicleMarker' qgc/src/FlightDisplay/FlyViewMap.qml
          # NAVO replaces QGC FlyView through the custom URL interceptor.
          # Do not patch upstream Viewer3D here: the old text patch was brittle and
          # run #229 still loaded the upstream FlyView, masking NAVO QML errors.
          grep -n "NavoDashboard.qml" qgc/custom/src/CustomPlugin.cc
          # NAVO Android lifecycle guard. QGC v5.0.7 dereferences
          # _mainRootWindow on QEvent::Quit even when it is still null. Current
          # upstream QGC has this guard; apply the same minimal fix to v5.0.7.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("qgc/src/QGCApplication.cc")
          src = p.read_text()
          needle = '        const bool forceClose = _mainRootWindow->property("_forceClose").toBool();'
          guard = '''        if (!_mainRootWindow) {
              return QApplication::event(e);
          }
          const bool forceClose = _mainRootWindow->property("_forceClose").toBool();'''
          if needle not in src:
              raise SystemExit("QGCApplication forceClose line not found in pinned v5.0.7")
          p.write_text(src.replace(needle, guard, 1))
          PY
          grep -n -A9 -B4 'if (!_mainRootWindow)' qgc/src/QGCApplication.cc
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Android NDK r26b
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
          add-to-path: false
      - name: Export NDK
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: '${{ runner.temp }}'
          modules: 'qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors'
          setup-python: false
          cache: true
      - name: Validate all NAVO QML syntax and QObject headers
        run: |
          set -euo pipefail
          QT_HOST="${{ runner.temp }}/Qt/6.8.3/gcc_64"
          for file in custom/qml/*.qml; do
            "$QT_HOST/bin/qmlformat" "$file" > /dev/null
          done
          for file in custom/src/*.h; do
            "$QT_HOST/libexec/moc" -I"$QT_HOST/include" -I"$QT_HOST/include/QtCore" "$file" -o /tmp/navo-moc-check.cpp
          done
      - name: Install Qt Android ABIs
        run: |
          python3 -m pip install --user 'aqtinstall==3.1.*'
          MODS='qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors'
          python3 -m aqt install-qt linux android 6.8.3 android_arm64_v8a --outputdir "${{ runner.temp }}/Qt" --modules $MODS
          python3 -m aqt install-qt linux android 6.8.3 android_x86_64 --outputdir "${{ runner.temp }}/Qt" --modules $MODS
      - name: Configure arm64 release
        run: |
          mkdir -p build
          "${{ runner.temp }}/Qt/6.8.3/android_arm64_v8a/bin/qt-cmake" -S qgc -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DQT_ANDROID_ABIS=arm64-v8a -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DQT_HOST_PATH="${{ runner.temp }}/Qt/6.8.3/gcc_64" -DQT_ANDROID_SIGN_APK=OFF -DQGC_STABLE_BUILD=ON
      - name: Build arm64 APK
        run: cmake --build build --target all --config Release --parallel
      - name: Prepare installable APK
        run: |
          set -euo pipefail
          APK="$(find build -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"; ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"; AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          if ! "$APKSIGNER" verify "$APK"; then
            KS="$HOME/.android/debug.keystore"; mkdir -p "$HOME/.android"
            [ -f "$KS" ] || keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=NAVO SMART,C=GB"
            "$ZIPALIGN" -f -p 4 "$APK" build/NAVO_SMART-aligned.apk
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out build/NAVO_SMART.apk build/NAVO_SMART-aligned.apk
          else cp "$APK" build/NAVO_SMART.apk; fi
          "$APKSIGNER" verify --verbose --print-certs build/NAVO_SMART.apk
          "$AAPT" dump badging build/NAVO_SMART.apk | head -n 8
      - name: Configure x86_64 smoke-test APK
        run: |
          mkdir -p build-x86
          "${{ runner.temp }}/Qt/6.8.3/android_x86_64/bin/qt-cmake" -S qgc -B build-x86 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DQT_ANDROID_ABIS=x86_64 -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DQT_HOST_PATH="${{ runner.temp }}/Qt/6.8.3/gcc_64" -DQT_ANDROID_SIGN_APK=OFF -DQGC_STABLE_BUILD=ON
      - name: Build x86_64 smoke-test APK
        run: cmake --build build-x86 --target all --config Release --parallel
      - name: Prepare x86_64 smoke-test APK
        run: |
          set -euo pipefail
          APK="$(find build-x86/android-build/build/outputs/apk -type f -name '*-unsigned.apk' | head -n 1)"; test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"; ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"; KS="$HOME/.android/debug.keystore"
          test -f "$KS"
          "$ZIPALIGN" -f -p 4 "$APK" build-x86/NAVO_SMART-x86-aligned.apk
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out build-x86/NAVO_SMART-x86.apk build-x86/NAVO_SMART-x86-aligned.apk
          "$APKSIGNER" verify --verbose build-x86/NAVO_SMART-x86.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build-x86/NAVO_SMART-x86.apk >/dev/null
      - name: Android emulator smoke test
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          set -euo pipefail
          mkdir -p build/screenshots "$ANDROID_AVD_HOME"
          sudo chmod 666 /dev/kvm || true

          sdkmanager "emulator" "system-images;android-34;default;x86_64"

          # Create the AVD in an explicit directory. Previous runs could create it
          # outside the directory searched by the emulator, producing
          # "Unknown AVD name [navo-smoke]".
          rm -rf "$ANDROID_AVD_HOME/navo-smoke.avd" "$ANDROID_AVD_HOME/navo-smoke.ini"
          printf 'no\n' | avdmanager create avd --force \
            --name navo-smoke \
            --package "system-images;android-34;default;x86_64" \
            --device "pixel_6"

          echo "Available AVDs:"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/navo-smoke.ini"
          test -d "$ANDROID_AVD_HOME/navo-smoke.avd"

          "$ANDROID_HOME/emulator/emulator" @navo-smoke \
            -port 5554 \
            -no-window \
            -gpu swiftshader_indirect \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -no-snapshot-save \
            -camera-back none \
            > build/emulator.log 2>&1 &
          EMULATOR_PID=$!

          cleanup() {
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          adb kill-server >/dev/null 2>&1 || true
          adb start-server

          # sys.boot_completed is the stable readiness signal. Do not make the
          # flaky Android input service a prerequisite for the whole build.
          if ! timeout 600 bash -c '
            until adb -s emulator-5554 get-state 2>/dev/null | grep -q "^device$" &&
                  [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 2
            done
          '; then
            echo "Emulator boot timed out"
            adb devices -l || true
            tail -n 160 build/emulator.log || true
            exit 1
          fi

          adb -s emulator-5554 wait-for-device
          sleep 5

          adb -s emulator-5554 shell input keyevent 82 || true
          adb -s emulator-5554 shell settings put global window_animation_scale 0.0 || true
          adb -s emulator-5554 shell settings put global transition_animation_scale 0.0 || true
          adb -s emulator-5554 shell settings put global animator_duration_scale 0.0 || true

          adb -s emulator-5554 install --no-streaming -r build-x86/NAVO_SMART-x86.apk

          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$AAPT2"
          PACKAGE="$("$AAPT2" dump badging build-x86/NAVO_SMART-x86.apk | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n1)"
          ACTIVITY="$("$AAPT2" dump badging build-x86/NAVO_SMART-x86.apk | sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p" | head -n1)"
          test -n "$PACKAGE"
          test -n "$ACTIVITY"

          "$AAPT2" dump badging build-x86/NAVO_SMART-x86.apk | grep -m1 '^package:'
          "$AAPT2" dump badging build-x86/NAVO_SMART-x86.apk | grep -m1 '^launchable-activity:'

          adb -s emulator-5554 logcat -c
          adb -s emulator-5554 shell settings put system accelerometer_rotation 0 || true
          adb -s emulator-5554 shell settings put system user_rotation 1 || true
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP || true
          adb -s emulator-5554 shell wm dismiss-keyguard || true
          adb -s emulator-5554 shell am start -W -n "$PACKAGE/$ACTIVITY"

          sleep 5
          adb -s emulator-5554 exec-out screencap -p > build/screenshots/dashboard-05s.png || true
          sleep 10
          adb -s emulator-5554 exec-out screencap -p > build/screenshots/dashboard-15s.png || true
          sleep 15
          adb -s emulator-5554 exec-out screencap -p > build/screenshots/dashboard-30s.png || true
          cp build/screenshots/dashboard-30s.png build/navo-screenshot.png 2>/dev/null || true

          adb -s emulator-5554 shell dumpsys window windows > build/window.txt || true
          adb -s emulator-5554 shell dumpsys activity activities > build/activity.txt || true
          adb -s emulator-5554 logcat -d > build/navo-logcat.txt || true
          adb -s emulator-5554 shell pidof "$PACKAGE" | tee build/navo-pid.txt
          test -s build/navo-pid.txt
      - name: Upload Android smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NAVO-SMART-ANDROID-SMOKE-TEST
          path: |
            build/emulator.log
            build/navo-pid.txt
            build/window.txt
            build/activity.txt
            build/navo-logcat.txt
            build/navo-screenshot.png
            build/screenshots/*.png
          if-no-files-found: warn
      - name: Upload installable APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NAVO-SMART-INSTALLABLE-APK
          path: build/NAVO_SMART.apk
